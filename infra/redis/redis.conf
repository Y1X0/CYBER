# Security Guardian Platform — production Redis (broker + result backend + replay-nonce store).
# Cert-free + secret-free: AUTH (--requirepass) and TLS (--tls-*) are layered by the compose command
# (secrets/cert paths), so this file stays committable and startable for validation.
# Managed Redis users can ignore this file and point GUARDIAN_REDIS_URL at the managed endpoint.

# ── Durability: AOF so the queue, results, AND the replay-nonce store survive a restart ───────────
# Without persistence a Redis restart drops queued jobs and RESETS the replay-nonce store, which
# briefly falls the single-use replay guard back to each job's signed-timestamp validity window
# (see docs/deployment/06). AOF (fsync every second) bounds loss to ~1s and preserves nonces.
appendonly yes
appendfsync everysec
# Persistence dir is the redis image's default working dir (/data), mounted to the redis-data volume
# in docker-compose.prod.yml. Left unset here so it also works under a local --dir for validation.
# Keep an RDB snapshot too (faster cold starts); AOF remains the source of truth on recovery.
save 900 1
save 300 10
save 60 10000

# ── Eviction: NEVER evict. A broker/nonce store must fail loudly, not silently drop a queued job or
# a replay nonce under memory pressure. Set maxmemory to your provisioned headroom and alert on it.
maxmemory-policy noeviction
# maxmemory 512mb        # uncomment + size to the container's mem_limit; alert at ~80%.

# ── Connection hygiene ────────────────────────────────────────────────────────────────────────────
tcp-keepalive 60
timeout 0
# Bind is handled by the container network; do NOT expose Redis to the host/internet (see compose).
# Protected-mode + AUTH (--requirepass, injected by the compose command) guard anonymous access.
