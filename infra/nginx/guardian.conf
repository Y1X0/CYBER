# Security Guardian Platform — production ingress (reference).
# TLS termination + HTTP->HTTPS + correct X-Forwarded-For + request-body cap in front of the API.
# Uvicorn is NEVER published to the internet; only this ingress binds host :80/:443.
# Mounted at /etc/nginx/conf.d/default.conf by the `ingress` service in docker-compose.prod.yml.
# TLS certs are operator-provided in ./infra/tls/nginx (see infra/tls/README.md).

# ── HTTP :80 — ACME HTTP-01 passthrough, everything else redirected to HTTPS ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / ACME HTTP-01 challenge (if used). Harmless otherwise.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — terminate TLS, proxy to the API on the internal network ─────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — the platform is TLS-only behind this ingress (defense in depth; complements the app).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request-body cap (discovery finding D-13: the app has NO in-process limit, by design — the
    # limit is enforced HERE at the edge). Tune GUARDIAN_INGRESS_MAX_BODY to your largest legit upload.
    client_max_body_size 10m;

    # Docker's embedded DNS, so `api` re-resolves across replicas (deploy.replicas) instead of
    # pinning to one container IP at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # One trusted hop appends here → the app must run with GUARDIAN_TRUSTED_PROXY_COUNT=1
        # (or 1 + the number of additional trusted LBs in front of this ingress).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # /health and /health/ready are mounted at the API root (not under /api/v1) and are reached
    # through the location / above — an external LB can liveness-check the API via
    # https://<host>/health and readiness via https://<host>/health/ready.
}
