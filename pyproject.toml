[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-guardian"
version = "0.1.0"
description = "AI Security Operations Platform — defensive security auditing (Phase 1 Foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # API / control plane
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    # Auth / security
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",  # envelope encryption of credential references
    # Data
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Async / queue
    "celery>=5.3",
    "redis>=5.0",
    "msgpack>=1.2.1",  # transitive (celery->kombu); pin >=1.2.1 for GHSA-6v7p-g79w-8964 (HIGH)
    # Observability / utils
    "structlog>=24.1",
    "httpx>=0.27",
    "pyyaml>=6.0",  # Kubernetes manifest parsing
    # Live DNS discovery: A/AAAA plus the CNAME chain a subdomain-takeover claim depends on, which
    # socket.getaddrinfo cannot see. ISC-licensed — permissive, safe to ship commercially.
    "dnspython>=2.6",
    # Reporting (pure-python PDF, no system libs)
    "reportlab>=4.1",
]

[project.scripts]
guardian = "guardian_cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pip-audit>=2.7",  # self dependency-vulnerability scan (CI dogfood, Phase 5A)
]
# AI analyst provider — optional so CI/offline runs on the deterministic stub provider.
ai = [
    "anthropic>=0.40",
]

# First-party scanner plugins are discovered via entry points (plugin architecture, doc 07 §4).
[project.entry-points."guardian.scanner_plugins"]
secrets = "guardian_scanner.engines.secrets_engine:SecretsEngine"
sast = "guardian_scanner.engines.sast_engine:SastEngine"
sca = "guardian_scanner.engines.sca_engine:ScaEngine"
cspm = "guardian_scanner.engines.cspm_engine:CspmEngine"
container = "guardian_scanner.engines.container_engine:ContainerEngine"
k8s = "guardian_scanner.engines.k8s_engine:K8sEngine"
iac = "guardian_scanner.engines.iac_engine:IacEngine"
dast = "guardian_scanner.engines.dast_engine:DastEngine"
api = "guardian_scanner.engines.api_engine:ApiEngine"

# EASM discovery collectors (Phase 6) — same plugin pattern as scanners. Passive providers first.
[project.entry-points."guardian.discovery_providers"]
dns = "guardian_scanner.discovery.providers.dns_provider:DnsProvider"
ct = "guardian_scanner.discovery.providers.ct_provider:CtLogProvider"
# Passive ASN/RIR netblock discovery (Phase 6F-b) — public registry data, no active probing.
asn = "guardian_scanner.discovery.providers.asn_provider:AsnRirProvider"
# Active (Phase 6C) — authorization-gated; the only active provider, deliberately limited to 80/443.
service_scan = "guardian_scanner.discovery.providers.service_scan_provider:ServiceScanProvider"

# Protocol probes (Phase 6C.2) — one low-impact identification plugin per protocol. Only http/tls
# (80/443) now; new protocols register here later without touching the orchestrator or core.
[project.entry-points."guardian.protocol_probes"]
http = "guardian_scanner.discovery.protocols.http_probe:HttpProbe"
tls = "guardian_scanner.discovery.protocols.tls_probe:TlsProbe"

# Security tool providers (Framework) — a tool is a governed, sandboxed, scoped Provider. The first
# provider is read-only Web/TLS: it observes an authorized host, it never crawls/fuzzes/exploits.
[project.entry-points."guardian.tool_providers"]
web_tls = "guardian_scanner.tools.providers.web_tls_provider:WebTlsProvider"
# Offline PCAP header/metadata analysis — untrusted-artifact branch, no network, stdlib-only parser.
pcap_meta = "guardian_scanner.tools.providers.pcap_provider:PcapMetaProvider"
# Offline DNS / email-security posture — posture branch (absence-as-evidence), no network, no deps.
dns_posture = "guardian_scanner.tools.providers.dns_posture_provider:DnsPostureProvider"
# Nmap TCP-connect active network discovery (L2) — argv-isolated, no root, stdlib XML, no python-nmap.
nmap = "guardian_scanner.tools.providers.nmap_provider:NmapProvider"
# CT passive attack-surface discovery (L1) — in-proc, fixed-endpoint egress, anti-SSRF, no secrets.
ct_surface = "guardian_scanner.tools.providers.ct_surface_provider:CtSurfaceProvider"
# Nmap service/version detection (L2) — bounded -sV --version-intensity 2, external binary, uid_nft.
nmap_service = "guardian_scanner.tools.providers.nmap_service_provider:NmapServiceProvider"
# Templated web checks (L3) — in-proc httpx, curated source-controlled checks, anti-SSRF, no Nuclei.
web_checks = "guardian_scanner.tools.providers.web_checks_provider:WebChecksProvider"

[tool.setuptools.packages.find]
# Monorepo: one installable distribution discovering packages from every src root.
where = [
    "packages/core/src",
    "packages/common/src",
    "packages/db/src",
    "packages/clients/src",
    "services/api/src",
    "services/ai_analyst/src",
    "workers/scanner/src",
    "cli/guardian/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",   # asserts (used in tests)
    "B008",   # function call in default arg — FastAPI's Depends() idiom
    "UP042",  # keep explicit `str, Enum` (portable, predictable .value semantics)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"**/migrations/**" = ["E501", "F401", "I001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
