# Full local stack — `docker compose up` brings up DB, cache, API, and worker (doc 01 §8).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      GUARDIAN_ENV: local
      GUARDIAN_DATABASE_URL: postgresql+psycopg://guardian:guardian@db:5432/guardian
      GUARDIAN_REDIS_URL: redis://redis:6379/0
      GUARDIAN_JWT_SECRET: change-me-dev-only-do-not-use-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Migrate + seed, then serve. Dev convenience; production separates these steps.
    command: >
      sh -c "alembic upgrade head &&
             python -m guardian_api.seed &&
             uvicorn guardian_api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      GUARDIAN_ENV: local
      GUARDIAN_DATABASE_URL: postgresql+psycopg://guardian:guardian@db:5432/guardian
      GUARDIAN_REDIS_URL: redis://redis:6379/0
      GUARDIAN_JWT_SECRET: change-me-dev-only-do-not-use-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A guardian_scanner.celery_app.celery_app worker --loglevel=info --concurrency=4

volumes:
  pgdata:
