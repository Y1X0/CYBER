# Full local stack — `docker compose up` brings up DB, cache, API, and the two workers (doc 01 §8).
#
# Recon Execution Plane isolation (Phase 6C.3 → hardened in 6C.4, ADR-011/ADR-013). This file is the
# runnable *reference*; production maps it to Kubernetes NetworkPolicy + resource limits + egress
# controls (docs/architecture/09-recon-execution-plane.md). Defense in depth:
#   C1 — Network isolation: the recon worker joins ONLY `recon-cache` (redis broker), never `backend`
#        and NEVER a network with the database (6C.4). So it cannot reach the API, the default
#        worker, or the DB. The API is never on `recon-cache`, so the control plane cannot reach the
#        recon plane either.
#   C2 — Egress allowlist: enforced in-process at the socket layer (guardian_scanner.egress), so a
#        recon probe can only reach a host the authorization gate cleared for the run.
#   6C.4 — Result-return: the recon worker holds NO DB credentials and reaches no DB. It runs only
#        `recon_collect` (probing) and returns evidence; the trusted `worker-default` authorizes and
#        persists. So the plane that touches untrusted network is architecturally DB-incapable.
networks:
  edge:         # user-facing; only the API sits here
  backend:      # control plane + default work reach db/cache here (recon worker is NOT on it)
  recon-cache:  # the ONLY internal network the recon worker joins: the redis broker, NO database

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]  # 6C.4: DB is NOT on the recon network — the recon plane has no route to it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [backend, recon-cache]  # broker + result backend — the recon plane's only shared dep
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      GUARDIAN_ENV: local
      # Admin URL (owner) runs migrations + seed; the app URL below binds request handlers to the
      # non-owner, RLS-enforced role. The `guardian_app` role is created by migration 0005.
      GUARDIAN_DATABASE_URL: postgresql+psycopg://guardian:guardian@db:5432/guardian
      GUARDIAN_APP_DATABASE_URL: postgresql+psycopg://guardian_app:guardian_app@db:5432/guardian
      GUARDIAN_REDIS_URL: redis://redis:6379/0
      GUARDIAN_JWT_SECRET: change-me-dev-only-do-not-use-in-production
      # Shared with the worker: the API encrypts credentials, the worker decrypts them at scan time.
      GUARDIAN_ENCRYPTION_KEY: dev-only-encryption-key-change-me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Control plane: on edge + backend only, NEVER on recon-data → structurally cannot reach the
    # recon worker. It enqueues by task name (send_task), so it never opens an external socket itself.
    networks: [edge, backend]
    # Migrate + seed, then serve. Dev convenience; production separates these steps.
    command: >
      sh -c "alembic upgrade head &&
             python -m guardian_api.seed &&
             uvicorn guardian_api.main:app --host 0.0.0.0 --port 8000"

  # Default / trusted plane — scans, analysis, AND the discovery orchestrator `run_discovery`
  # (authorize + persist) on the `default` queue. Holds DB credentials; reaches db/cache on backend.
  worker-default:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      GUARDIAN_ENV: local
      # Worker uses the admin URL by design: engines run cross-tenant and bypass RLS legitimately.
      GUARDIAN_DATABASE_URL: postgresql+psycopg://guardian:guardian@db:5432/guardian
      GUARDIAN_REDIS_URL: redis://redis:6379/0
      GUARDIAN_JWT_SECRET: change-me-dev-only-do-not-use-in-production
      GUARDIAN_ENCRYPTION_KEY: dev-only-encryption-key-change-me
      # Turn on to run untrusted-input engines in the resource-limited sandbox (5A).
      GUARDIAN_SANDBOX_ENGINES: "false"
      GUARDIAN_RECON_PLANE: "false"  # DB plane — `run_discovery` runs here, `recon_collect` refuses
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    # Container-level resource ceiling on top of the per-process rlimits inside the sandbox.
    mem_limit: 1g
    cpus: 1.0
    command: celery -A guardian_scanner.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q default

  # Recon execution plane — DB-LESS probing on the `recon` queue (6C.4). Runs only `recon_collect`.
  worker-recon:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      GUARDIAN_ENV: local
      # 6C.4: NO DB credentials. The recon plane holds no database URL and has no network route to
      # the DB, so it is architecturally incapable of direct DB access. It returns evidence instead.
      GUARDIAN_DATABASE_URL: ""
      GUARDIAN_REDIS_URL: redis://redis:6379/0
      GUARDIAN_JWT_SECRET: change-me-dev-only-do-not-use-in-production
      GUARDIAN_ENCRYPTION_KEY: dev-only-encryption-key-change-me
      # Active recon runs untrusted network work through the sandbox + egress allowlist.
      GUARDIAN_SANDBOX_ENGINES: "true"
      GUARDIAN_RECON_PLANE: "true"  # recon plane marker — `run_discovery` refuses to run here
    depends_on:
      redis:
        condition: service_healthy
    # ISOLATION (C1+6C.4): recon-cache ONLY (redis broker). Not on backend, not on any db network →
    # cannot reach the API, the default worker, or the database. Public internet egress is gated by
    # the authorization gate (upstream) + the in-process egress allowlist.
    networks: [recon-cache]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512  # container-level fork-bomb backstop (complements the sandbox RLIMIT_NPROC)
    command: celery -A guardian_scanner.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q recon

  # Tool execution plane — DB-LESS sandboxed tools on the `tools` queue (Security Tool Framework).
  # The same isolation as worker-recon: no DB URL, no route to the database, no KMS. It runs only
  # `run_tool` (providers in the mandatory sandbox with egress bound to the job scope) and returns
  # RawEvidence — so a compromise inside any tool finds no database, secrets, or other tenant.
  worker-tools:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      GUARDIAN_ENV: local
      GUARDIAN_DATABASE_URL: ""      # NO DB credentials (execution plane is DB-incapable)
      GUARDIAN_REDIS_URL: redis://redis:6379/0
      GUARDIAN_JWT_SECRET: change-me-dev-only-do-not-use-in-production
      GUARDIAN_ENCRYPTION_KEY: dev-only-encryption-key-change-me  # no KMS use on this plane
      GUARDIAN_SANDBOX_ENGINES: "true"
      GUARDIAN_TOOL_PLANE: "true"    # tool plane marker — the trusted dispatcher refuses to run here
    depends_on:
      redis:
        condition: service_healthy
    networks: [recon-cache]          # redis broker only; no route to the database or the API
    # CAP_NET_ADMIN (worker-tools ONLY) lets the uid+nft backend confine an external binary's egress
    # at the kernel, per run, from the EffectiveScope. NOT privileged; no CAP_NET_RAW (nmap -sT needs
    # none). The container has its own netns, so its nft rules never touch the host or other workers.
    cap_add: [NET_ADMIN]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    # concurrency=1: tool runs are serialized in this process so per-run uids are unique and one run's
    # nft rules can never affect another. Scale out with more worker-tools replicas (each its own netns).
    command: celery -A guardian_scanner.celery_app.celery_app worker --loglevel=info --concurrency=1 -Q tools

volumes:
  pgdata:
