<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04050a" />
    <title>Security Guardian</title>
    <!-- Inline so the identity needs no extra request and no file to go missing. The console was
         serving a 404 for every page load without one. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304050a'/%3E%3Cpath d='M16 5l9 4v7c0 6-4 10-9 11-5-1-9-5-9-11V9z' fill='none' stroke='%23ff2d4f' stroke-width='2.5'/%3E%3C/svg%3E" />
    <!-- Preconnect before the stylesheet so the handshake overlaps parsing rather than following
         it. `display=swap` means text renders in the fallback immediately: a console that shows
         nothing until a webfont arrives has made its own font a single point of failure. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Security Guardian requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
