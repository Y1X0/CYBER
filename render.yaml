# Render Blueprint — the deployed control plane, as a file rather than as dashboard clicks.
#
# Everything this stack needs is declared here: the web service, the broker, the database, and the
# wiring between them. A blueprint is the difference between a deployment someone can rebuild and
# one that exists only as a sequence of clicks nobody wrote down — which is how the previous
# deployment came to be gone with no record of how to recreate it.
#
# DEPLOY:  Render dashboard → Blueprints → New Blueprint Instance → this repo.
#
# WHAT IS FREE AND WHAT EXPIRES. Every plan below is `free`. Render's free Postgres is deleted 30
# days after creation and only one may exist per workspace — so this database is a pilot, not a
# home for anything that matters. Free web services sleep after 15 minutes of no traffic and cold
# start on the next request; a scan queued while asleep runs when the instance wakes, because the
# request that queues it is itself what wakes it.
#
# THE WORKERS. The control worker runs inside guardian-api (see infra/render/start.sh), not as a
# Background Worker, because Render bills those. That closes BLOCKER-1 — scans complete without a
# human dispatching a workflow. Untrusted ENGINE execution runs on a SECOND free service,
# `guardian-scan` (infra/render/start-scan-plane.sh), so a heavy DAST scan spends its RAM on its own
# 512 MB instance and cannot OOM-kill the API. That split preserves the plane separation the
# architecture maintains AND recovers resource isolation for the one plane that parses attacker bytes;
# `api` and the control worker still share one secret set (docker-compose.prod.yml), while the scan
# plane holds neither the JWT secret nor the KMS master.
#
# TLS IS NOT OPTIONAL HERE. The settings validator refuses to boot outside local/dev unless Redis
# is `rediss://` with credentials and Postgres pins an sslmode that actually encrypts. Render's
# INTERNAL URLs are plaintext `redis://` and carry no password, so `fromService`/`fromDatabase`
# with the internal connection string would fail that check — correctly. The external connection
# strings are TLS and authenticated, and they are what must be set. They are not injected here
# because a blueprint cannot read them; see the `sync: false` entries, which Render prompts for.

services:
  - type: web
    name: guardian-api
    runtime: python
    plan: free
    region: frankfurt
    # Pilot deploys from this feature branch. Cutover to `main` after the branch is merged — see
    # docs/deployment/11-branch-cutover.md (set this to `main` and repoint the image pipeline).
    branch: claude/security-guardian-architecture-p1315d
    buildCommand: bash infra/render/build.sh
    startCommand: bash infra/render/start.sh
    healthCheckPath: /health
    # Auto-deploy OFF, matching the live service: on the free tier the API is redeployed on purpose
    # (an env change or a manual trigger), not on every push, so a work-in-progress commit never
    # restarts the running control plane. A Blueprint sync must not flip this on.
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: GUARDIAN_ENV
        value: production

      - key: GUARDIAN_LOG_LEVEL
        value: INFO

      # ── connection strings ───────────────────────────────────────────────────────────────────
      # Set to the EXTERNAL URLs, with TLS. Not `fromDatabase`/`fromService`: those yield internal
      # plaintext URLs that the production validator rejects, and rightly — an unencrypted broker
      # carries job payloads and an unencrypted database carries every tenant's findings.
      #
      #   GUARDIAN_DATABASE_URL      postgresql+psycopg://…@…frankfurt-postgres.render.com/…?sslmode=require
      #   GUARDIAN_APP_DATABASE_URL  same host, user guardian_app (created by migration 0006)
      #   GUARDIAN_REDIS_URL         rediss://red-…:PASSWORD@frankfurt-keyvalue.render.com:6379
      - key: GUARDIAN_DATABASE_URL
        sync: false
      - key: GUARDIAN_APP_DATABASE_URL
        sync: false
      - key: GUARDIAN_REDIS_URL
        sync: false

      # ── secrets ──────────────────────────────────────────────────────────────────────────────
      # generateValue asks Render for a strong random value once, and it is never in this repo, in
      # a log, or in a chat transcript. The validator refuses the documented development sentinels
      # outside local/dev, so a leaked dev secret cannot be replayed against this deployment.
      - key: GUARDIAN_JWT_SECRET
        generateValue: true
      - key: GUARDIAN_ENCRYPTION_KEY
        generateValue: true
      - key: GUARDIAN_BROKER_SEAL_KEY
        generateValue: true
      - key: GUARDIAN_APP_DB_PASSWORD
        generateValue: true

      # The bootstrap admin. The validator refuses to start production with the publicly
      # documented password, which is why this is generated rather than defaulted — read it once
      # from the Render dashboard and change it on first sign-in.
      - key: GUARDIAN_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: GUARDIAN_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: GUARDIAN_BOOTSTRAP_TENANT
        value: Guardian Pilot

      # ── capability switches ──────────────────────────────────────────────────────────────────
      # The recon plane needs CAP_NET_ADMIN and kernel nftables for its egress allowlist. A Render
      # instance has neither, so it stays off: an engine whose sandbox cannot be enforced must not
      # run unconfined, and an engine that did not run reports `not_checked`, never `clean`.
      - key: GUARDIAN_RECON_PLANE
        value: "false"
      - key: GUARDIAN_SANDBOX_ENGINES
        value: "true"

      # CORS allowlist for the browser SPA. The web dashboard (guardian-console static site below) is
      # a SEPARATE origin from this API, so its exact origin must be listed here or the browser
      # blocks every cross-origin call. Set to the live console origin — currently
      # https://guardian-console.onrender.com (comma-separated for multiple). sync:false so it is
      # provided in the dashboard rather than committed here. NEVER use "*" — that plus credentials
      # is refused by the app, and even for bearer-token calls a wildcard is needless exposure.
      # (Live value already set on guardian-api: https://guardian-console.onrender.com.)
      - key: GUARDIAN_CORS_ORIGINS
        sync: false

      # ── client IP / rate-limit granularity ───────────────────────────────────────────────────
      # GUARDIAN_TRUSTED_PROXY_COUNT is intentionally NOT set here, so it stays at the fail-safe
      # default 0: the app then keys audit + login rate limiting on the SOCKET PEER and ignores
      # X-Forwarded-For entirely, which cannot be spoofed. Behind Render's edge the socket peer is
      # Render's proxy, so at 0 every user shares one login-rate-limit bucket — safe against a
      # brute-force *bypass* (it only makes the limit coarser), but poor per-user granularity.
      #
      # To get per-client granularity, set this to the NUMBER OF TRUSTED PROXY HOPS that append to
      # X-Forwarded-For between the real client and this service (see deps.client_ip). That number
      # MUST be verified against what Render actually sends — NOT guessed: setting it too high lets a
      # client PREPEND X-Forwarded-For entries and forge its source IP (defeating the rate limit).
      # Confirm the hop count with the OWNER-only diagnostic GET /api/v1/auth/proxy-diagnostic, which
      # reports only the X-Forwarded-For hop COUNT and the socket peer (never client IP values), then
      # set GUARDIAN_TRUSTED_PROXY_COUNT to that count.
      #
      # SET THIS: until it is set, per-client login rate limiting is DISABLED (the client IP is a
      # shared proxy value that cannot be keyed on safely), so password spraying is only bounded
      # per-account. The API logs a startup ERROR and reports it at GET /health/details while this
      # is the case. Setting the count from the diagnostic turns per-client limiting on.
      #
      # LOGIN ABUSE MODEL (no block is ever keyed on a value many users share, so one client can
      # never deny login to another who has the correct password):
      #   * a per-CLIENT bucket counts FAILED logins per resolved client IP (IPv6 by /64) and 429s a
      #     client over GUARDIAN_LOGIN_FAILED_PER_CLIENT_PER_MINUTE (default 20) — bounding spraying.
      #     Active only when the client IP is trustworthy (this count set, or local/dev); otherwise
      #     off (see the startup ERROR above).
      #   * a per-ACCOUNT limit bounds brute force against one account (only that account);
      #   * an Argon2 concurrency limiter (GUARDIAN_LOGIN_ARGON2_MAX_CONCURRENCY, default 4) sheds
      #     excess load with a retryable 503 instead of blocking anyone (short acquire timeout so a
      #     shed request never holds a worker thread long);
      #   * an ALERT-ONLY failed-login breaker (GUARDIAN_GLOBAL_LOGIN_BREAKER_PER_MINUTE, default 300)
      #     logs `login_global_breaker_tripped` and increments a metric but never returns 429.

  # ── Isolated scan-plane worker (ISSUE-3 / capacity split) ────────────────────────────────────────
  # Untrusted engine execution (DAST/API/mobile parsing customer-controlled bytes) runs HERE, on its
  # own free 512 MB instance, instead of beside the API. Splitting it off is the capacity fix: a heavy
  # DAST scan spends its RAM on THIS instance, so it can no longer OOM-kill guardian-api. guardian-api
  # keeps the API + control worker + beat and offloads each engine to this service over the shared
  # `scan` queue (GUARDIAN_SCAN_OFFLOAD=true, set on its control worker in infra/render/start.sh).
  #
  # THE SECRET BOUNDARY IS THE POINT, not just isolation. This plane is DB-less and holds NEITHER the
  # JWT secret NOR the credential KMS master (GUARDIAN_ENCRYPTION_KEY) — neither is listed below, and
  # config.py refuses to boot a scan_plane that carries either. It holds only the broker-seal key, and
  # that key MUST be the SAME value guardian-api uses (control seals the job, this plane unseals it) —
  # which is why it is pulled from guardian-api with `fromService` rather than generated afresh here.
  # Same for the broker URL: one shared Redis, pulled from guardian-api so the two always agree.
  #
  # WHY `web`, NOT `worker`. Render bills type=background_worker (402 on free), so this is a web
  # service and must bind a port; infra/render/start-scan-plane.sh runs a tiny /health responder
  # alongside the worker for exactly that. That endpoint is also the keepalive target — a free web
  # service sleeps after 15 min idle, and a scan offloaded to a sleeping plane would block until the
  # offload timeout, so guardian-keepalive.yml pings this /health too.
  - type: web
    name: guardian-scan
    runtime: python
    plan: free
    region: frankfurt
    branch: claude/security-guardian-architecture-p1315d  # cutover to main — docs/deployment/11-branch-cutover.md
    buildCommand: bash infra/render/build.sh
    startCommand: bash infra/render/start-scan-plane.sh
    healthCheckPath: /health
    # Auto-deploy OFF, like guardian-api: the scan plane is redeployed on purpose, not on every push.
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GUARDIAN_ENV
        value: production
      - key: GUARDIAN_LOG_LEVEL
        value: INFO

      # This IS the scan plane: mark it, sandbox its engines, and keep the recon plane off (a Render
      # instance has no CAP_NET_ADMIN for the recon egress allowlist).
      - key: GUARDIAN_SCAN_PLANE
        value: "true"
      - key: GUARDIAN_SANDBOX_ENGINES
        value: "true"
      - key: GUARDIAN_RECON_PLANE
        value: "false"

      # DB-less. Set EMPTY, not unset: the settings default is a non-empty localhost DSN that would
      # fail the production TLS check. Holding no DB URL also exempts this plane from the RLS app-role
      # requirement (see config.py _enforce_production_invariants), correctly — it never touches the DB.
      - key: GUARDIAN_DATABASE_URL
        value: ""
      - key: GUARDIAN_APP_DATABASE_URL
        value: ""

      # Shared broker + shared seal key, pulled from guardian-api so they MATCH by construction: the
      # control plane seals each engine job with the broker-seal key and this plane unseals it with the
      # SAME key — a mismatch would fail every unseal and every offloaded scan. (A Blueprint sync
      # resolves `fromService` to guardian-api's live value; standing this up outside a Blueprint sync,
      # set both to guardian-api's exact values by hand.)
      - key: GUARDIAN_REDIS_URL
        fromService:
          type: web
          name: guardian-api
          envVarKey: GUARDIAN_REDIS_URL
      - key: GUARDIAN_BROKER_SEAL_KEY
        fromService:
          type: web
          name: guardian-api
          envVarKey: GUARDIAN_BROKER_SEAL_KEY

      # Local scratch workspace for this instance only. Network engines (DAST/API) need no shared
      # artifact disk; artifact engines (mobile/iOS) are the deferred object-storage follow-up.
      - key: GUARDIAN_SCAN_WORKSPACE_DIR
        value: /tmp/guardian-scan

      # DELIBERATELY ABSENT: GUARDIAN_JWT_SECRET and GUARDIAN_ENCRYPTION_KEY. config.py refuses to
      # start a scan_plane that carries either — that refusal is the boundary, enforced in code.

  # ── Web dashboard (SPA) ──────────────────────────────────────────────────────────────────────────
  # The React/Vite SPA in apps/web, deployed as a Render STATIC SITE. This block names the LIVE
  # service `guardian-console` (https://guardian-console.onrender.com), which already exists and
  # auto-deploys from this branch; naming it here lets a Blueprint sync adopt it and apply the
  # `headers:` / `routes:` below rather than create a duplicate. It is a SEPARATE ORIGIN from
  # guardian-api, so: (a) VITE_API_BASE points the SPA at the API origin (its default "" would call
  # its own static origin, which has no API — set live on the service); (b) the CSP connect-src lists
  # that exact API origin; (c) the API's GUARDIAN_CORS_ORIGINS (above) lists THIS site's origin.
  #
  # The security headers below are set in Render's own `headers:` mechanism — a static host does not
  # honour apps/web/public/_headers (that is the Netlify/Cloudflare convention, kept only as a
  # fallback), and frame-ancestors / X-Frame-Options are header-only (a <meta> CSP cannot carry
  # them). They take effect on guardian-console only once this Blueprint is synced/adopted (or the
  # same headers are added on the service in the dashboard); until then the built <meta> CSP still
  # carries the fetch directives (incl. connect-src to the exact API origin).
  - type: web
    name: guardian-console
    runtime: static
    plan: free
    branch: claude/security-guardian-architecture-p1315d  # cutover to main — docs/deployment/11-branch-cutover.md
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Call the API cross-origin. Update if the API's URL changes; keep it EXACT (no trailing slash).
      - key: VITE_API_BASE
        value: https://guardian-api-s1jd.onrender.com
    routes:
      # SPA fallback: serve index.html for client-side routes (never for real asset paths).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        # default-src 'self'; no inline scripts / eval; API calls limited to 'self' + the exact API
        # origin; Google Fonts allowed; not framable. Keep in sync with apps/web/public/_headers.
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://guardian-api-s1jd.onrender.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=(), browsing-topics=()

databases:
  - name: guardian-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

# Render calls this resource type `redis` in blueprints even though the product is now Key Value.
services_note: |
  The broker is declared in the dashboard rather than here because a free Key Value instance and a
  free Postgres cannot both be created by a blueprint in every account state. guardian-queue
  (frankfurt, free) already exists; point GUARDIAN_REDIS_URL at its external rediss:// URL.
