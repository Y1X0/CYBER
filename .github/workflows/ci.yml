name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: CI only needs to read the repo. No write scopes are granted to the token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      GUARDIAN_ENV: ci
      GUARDIAN_DATABASE_URL: postgresql+psycopg://guardian:guardian@localhost:5432/guardian
      GUARDIAN_REDIS_URL: redis://localhost:6379/0
      GUARDIAN_JWT_SECRET: ci-only-secret-not-used-in-production-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrate database
        run: alembic upgrade head

      - name: Seed (smoke)
        run: python -m guardian_api.seed

      - name: Test
        env:
          GUARDIAN_RUN_DB_TESTS: "1"
        run: pytest -ra --cov=guardian_core --cov=guardian_scanner --cov=guardian_api

      # Dogfood gate (Phase 5): the platform will self-scan here and fail on high-risk findings.
