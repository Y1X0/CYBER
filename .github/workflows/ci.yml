name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: CI only needs to read the repo. No write scopes are granted to the token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      GUARDIAN_ENV: ci
      GUARDIAN_DATABASE_URL: postgresql+psycopg://guardian:guardian@localhost:5432/guardian
      # RLS-enforced app role (created by migration 0005). Set so the cross-tenant isolation and
      # negative-authorization tests actually run here instead of skipping.
      GUARDIAN_APP_DATABASE_URL: postgresql+psycopg://guardian_app:guardian_app@localhost:5432/guardian
      GUARDIAN_REDIS_URL: redis://localhost:6379/0
      GUARDIAN_JWT_SECRET: ci-only-secret-not-used-in-production-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrate database
        run: alembic upgrade head

      - name: Seed (smoke)
        run: python -m guardian_api.seed

      - name: Test
        env:
          GUARDIAN_RUN_DB_TESTS: "1"
        run: pytest -ra --cov=guardian_core --cov=guardian_scanner --cov=guardian_api

      # The console is part of the product, and one of its screens can mislead a customer about
      # their own security posture — an attack-graph view that renders a failed request as an empty
      # graph says "you are safe" on evidence it does not have. Its tests run here for that reason.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

      - name: Test web
        working-directory: apps/web
        run: npm test

      - name: Build web
        working-directory: apps/web
        run: npm run build

      # A scanner platform runs on tools other people wrote, so licence compliance is a shipping
      # gate rather than paperwork: nmap's NPSL restricts commercial redistribution, and AGPL §13
      # covers exactly the network interaction a SaaS product is. A tool nobody reviewed is treated
      # as unapproved, because the failure mode of the opposite default is found at due diligence.
      - name: Tool licence gate
        run: python tools/check_tool_licenses.py

      # ── Supply-chain self-scan (Phase 5A): know, then check, our own dependencies. ──
      - name: Generate self-SBOM
        run: python tools/generate_sbom.py sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: guardian-sbom
          path: sbom.json

      - name: Dependency vulnerability scan (pip-audit)
        # Recommended hardening, not a release blocker (per Phase 5 gate tiering): report advisories
        # in our own dependency tree without failing the build on a fresh upstream CVE.
        continue-on-error: true
        run: pip-audit --desc --strict
