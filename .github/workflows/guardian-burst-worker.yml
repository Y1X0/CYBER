# Guardian burst worker — an operator-triggered, one-shot drain of the `default` queue.
#
# Render refuses `type=background_worker` on the free tier with HTTP 402, so no long-lived consumer
# exists and a scan created through the API stays `queued` until something consumes it. This runs
# the ALREADY BUILT and licence-gated scanner image (A2, LIVE_VERIFIED) as a short-lived consumer,
# once, when an operator asks for it.
#
# WHAT THIS IS NOT. It is not a worker host and it is not a service. It does NOT close BLOCKER-1 —
# that is closed by a host. It is a manual tool for draining a queue on purpose while a permanent
# host is chosen, and every scan it executes was waiting for a human to run this.
#
# NEVER ADD A SCHEDULE TO THIS FILE. `workflow_dispatch` only — never `schedule`, never `push`.
# `guardian-golden-run.yml` states the rule this file is bound by too: keeping a queue drained for
# real customers is a service, a service does not belong in CI, and the fix is a host, not a cron.
# A `*/30 * * * *` schedule was briefly committed here and removed; it turned a manual tool into an
# unattended background service, which is precisely the thing the rule forbids. Beyond the terms
# question, a cron on the default branch starts consuming a production queue with nobody watching.
#
# The image's own CMD is already `celery ... worker --queues default --concurrency 1`, so nothing is
# rebuilt here and no scan logic is duplicated in CI. `timeout` ends the burst; SIGTERM lets Celery
# finish the task in flight rather than stranding it, which is what `task_acks_late` assumes.
name: Guardian Burst Worker

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the burst consumes the queue (max 300)."
        type: string
        required: false
        default: "25"
      beat:
        description: "Also run the embedded scheduler (sweep_schedules, webhook retries, feeds)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: read

# Two bursts consuming the same queue would double-deliver nothing (Redis hands each message to one
# consumer) but would double the DB connections and the tool-plane concurrency assumption. Queue the
# next run instead of cancelling it, so an operator who triggers twice gets two drains in sequence
# rather than the first one killed halfway through a scan.
concurrency:
  group: guardian-burst-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    environment: production
    # Job ceiling sits above the burst length so `timeout` is what stops the container — a job killed
    # by the runner skips the graceful shutdown and stalls whatever task was mid-flight.
    timeout-minutes: 310

    steps:
      - name: Resolve burst length
        id: cfg
        env:
          RAW: ${{ inputs.minutes || '25' }}
        run: |
          # Defaults rather than failing on an empty or non-numeric input. Clamped because the job
          # ceiling is fixed: a burst longer than the runner allows is a burst that ends by being
          # killed.
          mins="${RAW//[^0-9]/}"
          [ -n "$mins" ] || mins=25
          [ "$mins" -ge 1 ] || mins=1
          if [ "$mins" -gt 300 ]; then mins=300; fi
          echo "minutes=$mins" >> "$GITHUB_OUTPUT"
          echo "Burst length: ${mins} minute(s)"

      # Full history so the revision-guard step below can prove ancestry with `git merge-base`.
      - name: Check out repository (for the image-revision guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Pinned by digest, not by tag: this is the exact artifact guardian-deploy-worker.yml built and
      # pushed from HEAD. A floating tag would let the thing that runs in production drift away from
      # the thing that was verified. (Immutability is enforced by tests/test_scanner_image_supply_chain.py.)
      #
      # Built at `feb75c5` by guardian-deploy-worker.yml (mode: publish, run 35278363451). This commit
      # POSTDATES the scanner security hardening on this branch: the secure artifact-upload path
      # (f65c09f — AUD-P1-5 zip-bomb bounds, AUD-P1-6 tenant/asset-scoped artifact resolution that
      # stops the engine reading a config-supplied filesystem path, AUD-P1-7), the mobile/iOS engines,
      # and `celery_redis_url` (0317a86). Because the image now contains `celery_redis_url`, the broker
      # URL is normalised in-process and the workflow-level shim that used to live here was removed.
      # The image also sets GUARDIAN_SCANNER_WORKER=true, so it boots WITHOUT the seeding credential
      # GUARDIAN_BOOTSTRAP_ADMIN_PASSWORD (which belongs only to the API/control plane). To repin
      # after a future rebuild: run guardian-deploy-worker.yml (mode: publish), read the @sha256
      # digest it prints, and replace the digest below.
      - name: Pull the verified scanner image
        id: image
        run: |
          IMAGE="ghcr.io/y1x0/cyber-scanner@sha256:c2a09b39713a51e018fc5e1201d71f1eca7e59c4395d07ad9b7dfd7fcef8f26b"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
          docker pull "$IMAGE"

      # AUD-P1-6 guard: refuse to run any scanner image whose source commit predates the worker
      # file-read fix (f65c09f). The digest pinned above was built at feb75c5, a descendant of that
      # fix, so this guard passes; it stays as a tripwire against a future repin to a stale digest.
      # The revision is read from the image's own org.opencontainers.image.revision label; ancestry is
      # proved against this checkout, so no value is trusted that the repo cannot verify.
      - name: Refuse a scanner image that predates the AUD-P1-6 fix
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          MIN_REVISION="f65c09fc03ee1ee0ff34d6dafaf9822baa195465"  # AUD-P1-6: worker arbitrary file read
          REV="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE" 2>/dev/null || true)"
          if [ -z "$REV" ] || [ "$REV" = "<no value>" ]; then
            echo "##[error]scanner image has no org.opencontainers.image.revision label — cannot prove it postdates the AUD-P1-6 worker file-read fix. Rebuild + repin (see the 'Pull the verified scanner image' step)."
            exit 1
          fi
          echo "Image source revision: $REV"
          if ! git cat-file -e "${REV}^{commit}" 2>/dev/null; then
            echo "##[error]image revision $REV is not a commit in this repository — refusing an image whose provenance cannot be verified."
            exit 1
          fi
          if git merge-base --is-ancestor "$MIN_REVISION" "$REV"; then
            echo "OK: image includes the AUD-P1-6 fix ($MIN_REVISION)."
          else
            echo "##[error]scanner image was built at $REV, which PREDATES the AUD-P1-6 worker file-read fix ($MIN_REVISION). This image honours a tenant-controlled local_path and must not consume the queue. Rebuild the image from current HEAD and repin the digest."
            exit 1
          fi

      # A missing setting must stop the run here. Started anyway, Celery connects to a broker URL of
      # "" and the burst reports success having consumed nothing — the failure that looks like an
      # empty queue.
      - name: Check required settings are present
        env:
          GUARDIAN_DATABASE_URL: ${{ secrets.GUARDIAN_DATABASE_URL }}
          GUARDIAN_APP_DATABASE_URL: ${{ secrets.GUARDIAN_APP_DATABASE_URL }}
          GUARDIAN_REDIS_URL: ${{ secrets.GUARDIAN_REDIS_URL }}
          GUARDIAN_JWT_SECRET: ${{ secrets.GUARDIAN_JWT_SECRET }}
          GUARDIAN_ENCRYPTION_KEY: ${{ secrets.GUARDIAN_ENCRYPTION_KEY }}
          GUARDIAN_BROKER_SEAL_KEY: ${{ secrets.GUARDIAN_BROKER_SEAL_KEY }}
        run: |
          missing=""
          for k in GUARDIAN_DATABASE_URL GUARDIAN_APP_DATABASE_URL GUARDIAN_REDIS_URL \
                   GUARDIAN_JWT_SECRET GUARDIAN_ENCRYPTION_KEY GUARDIAN_BROKER_SEAL_KEY; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "##[error]missing required settings:$missing"
            echo "Set them under the 'production' environment in repository settings."
            exit 1
          fi
          echo "All required settings present (values not shown)."

      # The pinned image (built at cd01ace) contains `celery_redis_url`, which normalises a `rediss://`
      # broker URL in-process (appending `ssl_cert_reqs=required` when absent) before Celery constructs
      # the result backend. The workflow-level normalisation shim that used to sit here — needed only
      # while the pinned digest predated that function — was removed with the repin. The raw secret is
      # handed to each step that needs it via a step-level `env:` below.
      - name: Report queue depth before the burst
        continue-on-error: true
        env:
          GUARDIAN_REDIS_URL: ${{ secrets.GUARDIAN_REDIS_URL }}
        run: |
          # Read-only and allowed to fail: this is an observation, and losing the observation is not
          # a reason to skip the work.
          cat > /tmp/qdepth.py <<'PY'
          import os, redis
          # Normalise the rediss:// URL the same way the worker does, via the image's own
          # celery_redis_url (the pinned image now contains it), so a URL missing ssl_cert_reqs
          # does not fail the read.
          from guardian_common.config import celery_redis_url
          r = redis.from_url(celery_redis_url(os.environ["GUARDIAN_REDIS_URL"]))
          for q in ("default", "recon", "tools"):
              print(f"  {q:<8} {r.llen(q)} pending")
          PY
          sed -i 's/^          //' /tmp/qdepth.py
          docker run --rm -e GUARDIAN_REDIS_URL \
            -v /tmp/qdepth.py:/tmp/qdepth.py:ro \
            "${{ steps.image.outputs.ref }}" \
            python /tmp/qdepth.py || echo "  (queue depth unavailable)"

      - name: Consume the default queue
        env:
          GUARDIAN_DATABASE_URL: ${{ secrets.GUARDIAN_DATABASE_URL }}
          GUARDIAN_APP_DATABASE_URL: ${{ secrets.GUARDIAN_APP_DATABASE_URL }}
          GUARDIAN_REDIS_URL: ${{ secrets.GUARDIAN_REDIS_URL }}
          GUARDIAN_JWT_SECRET: ${{ secrets.GUARDIAN_JWT_SECRET }}
          GUARDIAN_ENCRYPTION_KEY: ${{ secrets.GUARDIAN_ENCRYPTION_KEY }}
          GUARDIAN_BROKER_SEAL_KEY: ${{ secrets.GUARDIAN_BROKER_SEAL_KEY }}
          BEAT: ${{ inputs.beat == true && '--beat' || '' }}
        run: |
          set -o pipefail
          SECONDS_LIMIT=$(( ${{ steps.cfg.outputs.minutes }} * 60 ))
          IMAGE="${{ steps.image.outputs.ref }}"

          # ISSUE-3: untrusted engine execution runs on a SEPARATE scan-plane container that holds
          # NEITHER the KMS master NOR the JWT secret — only the broker-seal key. Start it first,
          # detached, sharing a workspace volume with the control worker below; the control worker
          # sets GUARDIAN_SCAN_OFFLOAD=true and hands engine execution to it over the `scan` queue.
          # It gets no GUARDIAN_JWT_SECRET / GUARDIAN_ENCRYPTION_KEY: config refuses a scan_plane
          # that carries a master key, so a mis-set secret crashes it here, loudly. DB URLs are set
          # EMPTY (not omitted) to keep it DB-less — the settings default is a non-empty localhost
          # DSN, which would otherwise fail the production TLS check.
          docker volume create guardian-scan-ws >/dev/null
          docker run -d --name guardian-scan \
            -e GUARDIAN_ENV=production \
            -e GUARDIAN_REDIS_URL -e GUARDIAN_BROKER_SEAL_KEY \
            -e GUARDIAN_DATABASE_URL= -e GUARDIAN_APP_DATABASE_URL= \
            -e GUARDIAN_SCAN_PLANE=true -e GUARDIAN_SANDBOX_ENGINES=true \
            -e GUARDIAN_SCAN_WORKSPACE_DIR=/var/guardian/scan \
            -v guardian-scan-ws:/var/guardian/scan \
            "$IMAGE" \
            celery -A guardian_scanner.celery_app.celery_app worker \
              --queues scan --pool=solo --concurrency 1 \
              --without-gossip --without-mingle --loglevel INFO >/dev/null

          # Prove the scan plane actually booted (a scan plane that dies at startup would leave every
          # offloaded scan blocking on it). A dead container here fails the run rather than draining
          # with no scan plane.
          sleep 15
          if [ "$(docker inspect -f '{{.State.Running}}' guardian-scan 2>/dev/null)" != "true" ]; then
            echo "##[error]scan-plane worker failed to start:"
            docker logs guardian-scan 2>&1 | tail -40 || true
            docker rm -f guardian-scan >/dev/null 2>&1 || true
            docker volume rm guardian-scan-ws >/dev/null 2>&1 || true
            exit 1
          fi
          echo "scan-plane worker is up (no KMS master / JWT secret in its environment)."

          # --pool=solo, not prefork: the tool plane's uid_nft guard fails closed unless it can prove
          # a single allocator, and a single-process pool proves it by construction. Concurrency 1
          # for the same reason it is 1 on the provisioned worker — isolation, not throughput.
          #
          # --without-gossip/--without-mingle: both are peer coordination for a fleet. There is no
          # fleet, and mingle in particular blocks startup waiting for peers that never answer,
          # which on a 25-minute burst is time taken directly out of the work.
          #
          # SIGTERM (timeout's default) is Celery's graceful stop: it finishes the current task and
          # then exits. SIGKILL would drop it mid-flight, and with task_acks_late that means a
          # redelivery and a duplicate half-run rather than a clean resume.
          set +e
          timeout --signal=TERM --kill-after=120s "${SECONDS_LIMIT}s" \
            docker run --rm \
              -e GUARDIAN_ENV=production \
              -e GUARDIAN_DATABASE_URL -e GUARDIAN_APP_DATABASE_URL -e GUARDIAN_REDIS_URL \
              -e GUARDIAN_JWT_SECRET -e GUARDIAN_ENCRYPTION_KEY -e GUARDIAN_BROKER_SEAL_KEY \
              -e GUARDIAN_SCAN_OFFLOAD=true -e GUARDIAN_SCAN_WORKSPACE_DIR=/var/guardian/scan \
              -e CELERY_CONCURRENCY=1 \
              -v guardian-scan-ws:/var/guardian/scan \
              "${{ steps.image.outputs.ref }}" \
              celery -A guardian_scanner.celery_app.celery_app worker \
                --queues default \
                --pool=solo \
                --concurrency 1 \
                --without-gossip --without-mingle \
                --loglevel INFO \
                $BEAT
          rc=$?
          set -e

          # Tear down the scan-plane worker: show a tail of its log (proof it ran), then remove the
          # detached container and the shared workspace volume.
          echo "── scan-plane worker log (tail) ──"
          docker logs guardian-scan 2>&1 | tail -20 || true
          docker rm -f guardian-scan >/dev/null 2>&1 || true
          docker volume rm guardian-scan-ws >/dev/null 2>&1 || true

          # 124 is `timeout` reporting that it ended the burst on schedule. That is this workflow
          # working, so it must not be reported as a failed run — otherwise every successful burst
          # sends a failure notification and the real failures stop being read.
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 143 ] || [ "$rc" -eq 0 ]; then
            echo "Burst ended cleanly (exit ${rc})."
          else
            echo "##[error]worker exited ${rc} before the burst window closed"
            exit "$rc"
          fi

      - name: Report queue depth after the burst
        if: always()
        continue-on-error: true
        env:
          GUARDIAN_REDIS_URL: ${{ secrets.GUARDIAN_REDIS_URL }}
        run: |
          cat > /tmp/qdepth.py <<'PY'
          import os, redis
          # Normalise the rediss:// URL the same way the worker does, via the image's own
          # celery_redis_url (the pinned image now contains it), so a URL missing ssl_cert_reqs
          # does not fail the read.
          from guardian_common.config import celery_redis_url
          r = redis.from_url(celery_redis_url(os.environ["GUARDIAN_REDIS_URL"]))
          for q in ("default", "recon", "tools"):
              print(f"  {q:<8} {r.llen(q)} pending")
          PY
          sed -i 's/^          //' /tmp/qdepth.py
          docker run --rm -e GUARDIAN_REDIS_URL \
            -v /tmp/qdepth.py:/tmp/qdepth.py:ro \
            "${{ steps.image.outputs.ref }}" \
            python /tmp/qdepth.py || echo "  (queue depth unavailable)"
