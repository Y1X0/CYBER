# One-shot provisioning of the remaining connection secrets. DELETE once it has run.
#
# Fetches the Key Value connection string from the Render API and generates the four
# application secrets, then writes all five as production Environment secrets. Values are
# created and consumed inside the runner: none is typed by an operator, passed through a
# workflow input, or printed. Only shapes and booleans are logged.
#
# Needs RENDER_API_KEY (Render account API key) and GUARDIAN_SECRETS_PAT (Secrets +
# Environments write on this repository). Revoke both once the cutover is done.
name: Guardian Provision

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = report what would change; apply = write the secrets"
        type: choice
        required: true
        default: preview
        options: [preview, apply]
      key_value_id:
        description: "Render Key Value instance id"
        type: string
        required: true
        default: red-da15j161egvs73a19hkg

permissions:
  contents: read

concurrency:
  group: guardian-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Open external access, fetch the URL, generate the app secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ secrets.GUARDIAN_SECRETS_PAT }}
          KV_ID: ${{ inputs.key_value_id }}
          MODE: ${{ inputs.mode }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, secrets, subprocess, sys, urllib.error, urllib.request
          from urllib.parse import urlsplit

          API = "https://api.render.com/v1"
          key = (os.environ.get("RENDER_API_KEY") or "").strip()
          kv = (os.environ.get("KV_ID") or "").strip()
          mode = os.environ.get("MODE", "preview")
          repo = os.environ["TARGET_REPO"]
          if not key:
              sys.exit("RENDER_API_KEY is empty")

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"{API}{path}", method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": f"Bearer {key}", "Accept": "application/json",
                           **({"Content-Type": "application/json"} if body is not None else {})},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else {}

          # Render renamed Redis to Key Value; accept either route so the call does not depend
          # on which name this account's API is serving.
          def try_routes(method, suffix, body=None):
              last = None
              for base in (f"/key-value/{kv}", f"/redis/{kv}"):
                  try:
                      return call(method, base + suffix, body)
                  except urllib.error.HTTPError as e:
                      last = f"{e.code} on {base}{suffix}"
                      if e.code not in (404, 400):
                          break
              raise SystemExit(f"Render API failed: {last}")

          # 1) allow external clients — a Key Value with an empty allow list refuses every
          #    connection from outside Render, including this runner.
          allow = [{"cidrBlock": "0.0.0.0/0", "description": "cutover verification"}]
          if mode == "apply":
              try_routes("PATCH", "", {"ipAllowList": allow})
              print("  ip allow list : opened")
          else:
              print("  ip allow list : would open (0.0.0.0/0)")

          # 2) read the external connection string
          info = try_routes("GET", "/connection-info")
          url = (info.get("externalConnectionString") or "").strip()
          if not url:
              sys.exit("Render returned no externalConnectionString")

          p = urlsplit(url)
          tls, auth = p.scheme == "rediss", bool(p.password)
          print(f"  redis scheme  : {p.scheme}://   tls={tls}  auth_present={auth}")
          if not (tls and auth):
              sys.exit("external URL is not rediss:// with credentials — refusing to store it")

          # 3) application secrets, CSPRNG, distinct by construction
          gen = lambda: secrets.token_urlsafe(48)
          enc, seal = gen(), gen()
          assert enc != seal
          payload = {
              "GUARDIAN_REDIS_URL": url,
              "GUARDIAN_JWT_SECRET": gen(),
              "GUARDIAN_ENCRYPTION_KEY": enc,
              "GUARDIAN_BROKER_SEAL_KEY": seal,
              "GUARDIAN_BOOTSTRAP_ADMIN_PASSWORD": gen(),
          }
          print("  generated     : JWT_SECRET, ENCRYPTION_KEY, BROKER_SEAL_KEY (distinct), "
                "BOOTSTRAP_ADMIN_PASSWORD")

          if mode != "apply":
              print("PREVIEW ONLY — nothing was written.")
              raise SystemExit(0)

          for name, value in payload.items():
              r = subprocess.run(
                  ["gh", "secret", "set", name, "--env", "production", "--repo", repo],
                  input=value, text=True, capture_output=True,
              )
              if r.returncode != 0:
                  sys.exit(f"gh failed for {name}: {r.stderr.strip()[:200]}")
              print(f"  updated {name}")

          print("\nNo secret value was printed, logged, or passed as an input.")
          PY
