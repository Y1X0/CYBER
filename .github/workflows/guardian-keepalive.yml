# Keep the deployed control plane awake.
#
# WHAT THIS DOES AND, MORE IMPORTANTLY, WHAT IT DOES NOT.
#
# It issues one unauthenticated GET to /health every ten minutes. That is the whole job. It never
# starts a scan, never dispatches a worker, never touches a customer asset, and holds no secret —
# it cannot, because /health needs no credential and returns no tenant data.
#
# This file has a schedule, and `guardian-burst-worker.yml` deliberately does not, so the
# distinction has to be explicit rather than assumed. A schedule that can begin active security
# testing against real hosts must never exist: nobody should discover their systems were probed
# because a cron fired. A schedule that sends one HTTP request to our own health endpoint carries
# none of that risk. The rule was never "no cron"; it was "nothing may start a scan on its own".
#
# WHY IT EXISTS. Render's free plan stops the instance after fifteen minutes of no traffic. The
# next request waits thirty to fifty seconds for a cold start — and in a browser it does not even
# wait, because the holding page Render serves while starting carries no CORS headers, so the
# console's fetch is rejected outright and the user sees "Failed to fetch". Keeping the instance
# warm removes the failure rather than explaining it.
#
# COST. Roughly 4,300 runs a month at a few seconds each, well inside the free Actions allowance,
# and it keeps the service inside Render's 750 free instance-hours (one always-on service is ~730).
#
# STATUS: the automatic schedule is DISABLED. This runs on `workflow_dispatch` only now — trigger it
# by hand from the Actions tab to warm the instance when needed. The 10-minute cron was removed as
# part of the deployment cutover (see docs/deployment/11-branch-cutover.md): the pilot deploys from
# the `claude/security-guardian-architecture-p1315d` branch, and once it deploys from `main` the
# keep-alive strategy is revisited with the target plan (a paid always-on instance needs no
# keep-alive; a free instance can re-enable the cron by restoring the `schedule:` block below).
#
# TO RE-ENABLE THE CRON: restore the `schedule:` block under `on:`. TO STOP IT ENTIRELY: disable the
# workflow in the Actions tab, or delete this file. Nothing depends on it.

name: Guardian Keep-Alive

on:
  # schedule:                 # DISABLED (see the note above). workflow_dispatch only.
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

# Read-only. This workflow has no reason to touch the repository.
permissions:
  contents: read

concurrency:
  group: guardian-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the control plane and the scan plane
        env:
          # Both free web services sleep after 15 min idle. guardian-api is the API + control worker;
          # guardian-scan is the isolated scan-plane worker (render.yaml). The scan plane matters as
          # much as the API here: a scan offloaded to a SLEEPING scan plane blocks until the offload
          # timeout, so the engine never runs. One line per service — add the scan plane's real
          # /health URL once the service is created (its Render subdomain).
          URLS: |
            https://guardian-api-s1jd.onrender.com/health
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            # --max-time 90 because a cold start legitimately takes most of a minute; a shorter
            # timeout would report the wake-up as a failure and teach us to ignore this job.
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 90 "$url" || echo 000)"
            echo "GET ${url} -> ${code}"
            head -c 200 /tmp/body || true
            echo
            # A non-200 is reported, not swallowed. A keep-alive that cannot fail tells us the
            # service is up whether or not it is, which is worse than having no keep-alive.
            if [ "$code" != "200" ]; then
              echo "::error::${url} answered ${code} — that plane is not serving."
              fail=1
            fi
          done <<< "$URLS"
          exit "$fail"
