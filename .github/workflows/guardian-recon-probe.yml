name: Guardian Recon Probe

# One-off empirical diagnostic (workflow_dispatch only). Sanctioned target: scanme.nmap.org is
# explicitly authorized by Nmap for scan testing. TCP connect only; no NSE/UDP/OS/sweep.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Sanctioned nmap target (authorized for scanning)"
        required: true
        default: "scanme.nmap.org"

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/y1x0/cyber-scanner@sha256:7b6082ed0bced75760cf15f33a95630d8128384008ff4c392e5630db10e7984a
      TARGET: ${{ inputs.target }}
    steps:
      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Pull the pinned scanner image
        run: docker pull "$IMAGE"

      - name: Resolve target IPv4 (Guardian scope is IPv4-shaped)
        id: rip
        run: |
          IP=$(getent ahostsv4 "$TARGET" | awk 'NR==1{print $1}')
          echo "Resolved $TARGET -> IPv4 $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: (a) Is nmap/nft in the scan-plane image?
        run: |
          echo "=== inside $IMAGE ==="
          docker run --rm --entrypoint sh "$IMAGE" -c 'echo -n "which nmap: "; which nmap || echo MISSING; echo -n "which nft: "; which nft || echo MISSING' || true

      - name: (b) Install nmap on the runner and really scan the target (IPv4)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap
          nmap --version | head -1
          echo "=== nmap -Pn -T4 ${{ steps.rip.outputs.ip }} (non-root TCP connect) ==="
          nmap -Pn -T4 "${{ steps.rip.outputs.ip }}" || echo "NMAP_EXIT=$?"

      - name: Write the Guardian-provider probe
        run: |
          cat > /tmp/probe_c.py <<'PY'
          import os
          ip = os.environ.get("TARGET_IP", "").strip()
          print("target ip:", ip, flush=True)
          from guardian_core.tool import ToolJob, EffectiveScope
          from guardian_scanner.tools.providers.nmap_provider import NmapProvider
          from guardian_scanner.tools.execution import execute_tool
          from guardian_scanner.tools.backends import uid_nft
          scope = EffectiveScope(targets=(ip,), ports=(22, 80, 9929), protocols=("tcp",),
                                 network_allowed=True, read_only=True)
          job = ToolJob(tenant_id="probe", job_id="reconprobe", tool_key="nmap", scope=scope,
                        settings={"allow_live": True})
          prov = NmapProvider()
          print("--- (c1) execute_tool as the scan worker would (worker concurrency UNSET) ---", flush=True)
          try:
              ev = execute_tool(prov, job)
              print("  evidence_count:", len(ev), flush=True)
              for e in ev:
                  print("   ", e.kind, e.data, flush=True)
          except Exception as exc:
              print("  RAISED:", type(exc).__name__, exc, flush=True)
          print("--- (c2) set_worker_concurrency(1); isolate() to reach the nft/CAP_NET_ADMIN gate ---", flush=True)
          uid_nft.set_worker_concurrency(1)
          try:
              with uid_nft.isolate(job) as uid:
                  print("  ISOLATION ESTABLISHED uid=", uid, "(nft table created; CAP_NET_ADMIN present)", flush=True)
          except Exception as exc:
              print("  ISOLATION REFUSED:", type(exc).__name__, "->", exc, flush=True)
          print("--- (c3) full execute_tool path after concurrency=1 ---", flush=True)
          try:
              ev2 = execute_tool(prov, job)
              print("  evidence_count:", len(ev2), flush=True)
              for e in ev2:
                  print("   ", e.kind, e.data, flush=True)
          except Exception as exc:
              print("  RAISED:", type(exc).__name__, exc, flush=True)
          PY
          echo "wrote /tmp/probe_c.py"

      - name: (c) Guardian provider path — default scan image, NO CAP_NET_ADMIN (expect fail-closed)
        run: |
          docker run --rm -e TARGET_IP="${{ steps.rip.outputs.ip }}" \
            -v /tmp/probe_c.py:/tmp/probe_c.py:ro --entrypoint python "$IMAGE" /tmp/probe_c.py || true

      - name: (d) CAP_NET_ADMIN capability test on a clean container (does nft work on a GH runner?)
        run: |
          docker run --rm --cap-add=NET_ADMIN ubuntu:24.04 bash -c '
            set -x
            apt-get update -qq && apt-get install -y -qq nftables nmap
            echo "=== can CAP_NET_ADMIN create an nft table in a GH-runner container? ==="
            nft add table inet guardian_probe && echo "NFT_ADD_TABLE_OK" && nft list tables && nft delete table inet guardian_probe
            echo "=== nmap -sT -Pn -p22,80,9929 '"${{ steps.rip.outputs.ip }}"' ==="
            nmap -sT -Pn -p22,80,9929 '"${{ steps.rip.outputs.ip }}"'
          ' || echo "D_EXIT=$?"

      - name: (e) Positive Guardian path — scanner image WITH CAP_NET_ADMIN + nft/nmap installed (visible apt)
        run: |
          docker run --rm --cap-add=NET_ADMIN -e TARGET_IP="${{ steps.rip.outputs.ip }}" \
            -v /tmp/probe_c.py:/tmp/probe_c.py:ro --entrypoint bash "$IMAGE" -c '
              set -x
              apt-get update && apt-get install -y nmap nftables
              echo "in-container nmap: $(command -v nmap || echo MISSING) | nft: $(command -v nft || echo MISSING)"
              python /tmp/probe_c.py
            ' || echo "E_EXIT=$?"
