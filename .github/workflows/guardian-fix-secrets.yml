# One-shot repair for the two connection-string secrets. DELETE THIS FILE once it has run.
#
# The runner already receives all three secrets as environment variables, so it can rebuild the
# DSNs correctly without anyone reading, typing, or transporting a credential. It:
#   * forces the SQLAlchemy driver prefix  postgresql+psycopg://
#   * forces                               sslmode=verify-full
#   * rebuilds the app DSN on the SAME host as the owner DSN, with the stored app password
#   * drops a "-pooler" endpoint (transaction-mode pooling breaks migrations)
# GUARDIAN_APP_DB_PASSWORD is read but never modified.
#
# Writing a secret needs more than the default GITHUB_TOKEN, so this reads a fine-grained PAT from
# the secret GUARDIAN_SECRETS_PAT (Secrets: read+write on this repository only). Revoke that token
# and delete this workflow as soon as the run succeeds.
#
# Nothing is printed but the host and the resulting shape — no DSN, no password.
name: Guardian Fix Secrets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = show what would change; apply = write the secrets"
        type: choice
        required: true
        default: preview
        options: [preview, apply]

permissions:
  contents: read

concurrency:
  group: guardian-fix-secrets
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Normalise and write
        env:
          OWNER_RAW: ${{ secrets.GUARDIAN_DATABASE_URL }}
          APP_PW: ${{ secrets.GUARDIAN_APP_DB_PASSWORD }}
          GH_TOKEN: ${{ secrets.GUARDIAN_SECRETS_PAT }}
          MODE: ${{ inputs.mode }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          owner_raw = (os.environ.get("OWNER_RAW") or "").strip()
          app_pw = (os.environ.get("APP_PW") or "").strip()
          mode = os.environ.get("MODE", "preview")
          repo = os.environ["TARGET_REPO"]

          if not owner_raw:
              sys.exit("GUARDIAN_DATABASE_URL is empty — nothing to normalise")
          if not app_pw:
              sys.exit("GUARDIAN_APP_DB_PASSWORD is empty — cannot rebuild the app DSN")

          parts = urlsplit(owner_raw)
          if not parts.hostname:
              sys.exit("GUARDIAN_DATABASE_URL is not a connection URI (no host)")

          host = parts.hostname
          pooled = "-pooler" in host
          if pooled:
              host = host.replace("-pooler", "")
          port = f":{parts.port}" if parts.port else ""
          path = parts.path or "/guardian"
          query = [(k, v) for k, v in parse_qsl(parts.query) if k != "sslmode"]
          query.append(("sslmode", "verify-full"))
          qs = urlencode(query)

          def build(user, password):
              return urlunsplit(
                  ("postgresql+psycopg", f"{user}:{password}@{host}{port}", path, qs, "")
              )

          owner_dsn = build(parts.username or "", parts.password or "")
          app_dsn = build("guardian_app", app_pw)

          # Everything printed below is non-sensitive: host, database, and the enforced shape.
          print("=" * 68)
          print(f"  host        : {host}")
          print(f"  database    : {path.lstrip('/')}")
          print("  scheme      : postgresql+psycopg://   (was: "
                f"{parts.scheme}://)")
          print("  sslmode     : verify-full")
          print(f"  owner user  : {parts.username}")
          print("  app user    : guardian_app  (rebuilt on the owner host)")
          if pooled:
              print("  note        : dropped the -pooler endpoint")
          print("=" * 68)

          if mode != "apply":
              print("PREVIEW ONLY — no secret was written. Re-run with mode=apply to commit this.")
              raise SystemExit(0)

          for name, value in (
              ("GUARDIAN_DATABASE_URL", owner_dsn),
              ("GUARDIAN_APP_DATABASE_URL", app_dsn),
          ):
              p = subprocess.run(
                  ["gh", "secret", "set", name, "--env", "production", "--repo", repo],
                  input=value, text=True, capture_output=True,
              )
              if p.returncode != 0:
                  sys.exit(f"gh failed for {name}: {p.stderr.strip()[:200]}")
              print(f"  updated {name}")

          print("\nGUARDIAN_APP_DB_PASSWORD was NOT modified.")
          PY
