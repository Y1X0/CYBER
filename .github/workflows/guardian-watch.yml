# Uptime probe with an alert destination that reaches a person.
#
# Render shows metrics and logs, but only to someone who is already looking at the dashboard.
# This probes the public URLs on a schedule and turns a sustained failure into a GitHub issue,
# which mails whoever watches the repository — the cheapest alert channel that does not depend
# on anyone remembering to check.
#
# Alert hygiene matters more than alert volume. The first failure opens an issue; while it stays
# broken the issue body is rewritten in place, which does not notify again; recovery posts one
# comment and closes it. So a day-long outage produces two notifications, not seventy.
#
# The external probes cannot see everything. A deploy that failed and rolled back leaves the old
# version answering happily, and a suspended service looks like any other outage. Render knows
# both, and its own notification endpoints return 404 on this account, so this asks the API
# directly instead. Depth beyond liveness is the smoke workflow's job.
name: Guardian Watch

on:
  schedule:
    # Every 20 minutes, off the hour — schedules pinned to :00 queue behind everyone else's.
    - cron: "9,29,49 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: guardian-watch
  cancel-in-progress: false

env:
  API: https://guardian-api-pjp3.onrender.com
  WEB: https://guardian-web-412r.onrender.com
  API_SERVICE: srv-da18rq0u01pc739npf20
  WEB_SERVICE: srv-da196i8jo6nc7384s360

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Probe and alert
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          API = os.environ["API"].rstrip("/")
          WEB = os.environ["WEB"].rstrip("/")
          GH = "https://api.github.com"
          REPO = os.environ["REPO"]
          LABEL = "guardian-probe"

          def http(url, timeout=30):
              try:
                  t0 = time.time()
                  with urllib.request.urlopen(
                          urllib.request.Request(url, headers={"Accept": "*/*"}),
                          timeout=timeout) as r:
                      return r.status, int((time.time() - t0) * 1000), r.read(200)
              except urllib.error.HTTPError as e:
                  return e.code, int((time.time() - t0) * 1000), e.read(200)
              except Exception as e:
                  # Keep the reason. A bare "down" cannot distinguish DNS from TLS from a reset,
                  # and those are three different repairs.
                  return 0, 0, f"{type(e).__name__}: {e}".encode()[:200]

          # The service is on the free plan and sleeps when idle, so a cold start is not an
          # outage. Give it a wake window before believing the first failure.
          def probe(url, want=200, attempts=6):
              for i in range(attempts):
                  code, ms, body = http(url)
                  if code == want:
                      return True, code, ms, body
                  if i < attempts - 1:
                      time.sleep(10)
              return False, code, ms, body

          checks = [("API /health", f"{API}/health", 200),
                    ("API /health/ready", f"{API}/health/ready", 200),
                    ("API auth refused", f"{API}/api/v1/auth/me", 401),
                    ("web root", f"{WEB}/", 200),
                    ("web -> API rewrite", f"{WEB}/api/v1/auth/me", 401)]

          rows, failures = [], []
          for name, url, want in checks:
              ok, code, ms, body = probe(url, want)
              detail = "" if ok else f" — {body.decode(errors='replace')[:80]}"
              rows.append(f"| {name} | {'up' if ok else 'DOWN'} | {code} (want {want}) | {ms} ms |")
              if not ok:
                  failures.append(f"{name}: got {code}, expected {want}{detail}")

          # --- what the outside cannot see -------------------------------------------------
          def render(path):
              req = urllib.request.Request(
                  f"https://api.render.com/v1{path}",
                  headers={"Authorization": f"Bearer {os.environ['RENDER_API_KEY'].strip()}",
                           "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else {}

          for name, sid in (("api", os.environ["API_SERVICE"]),
                            ("web", os.environ["WEB_SERVICE"])):
              try:
                  svc = render(f"/services/{sid}")
                  deploys = render(f"/services/{sid}/deploys?limit=1")
                  state = svc.get("suspended")
                  status = ((deploys[0].get("deploy") or deploys[0]).get("status")
                            if deploys else "none")
                  ok = state == "not_suspended" and status == "live"
                  rows.append(f"| {name} service (Render) | {'ok' if ok else 'DEGRADED'} "
                              f"| {state}, last deploy {status} | — |")
                  if not ok:
                      failures.append(f"{name} service: suspended={state}, "
                                      f"last deploy={status}")
              except Exception as e:
                  # A Render API outage is not a Guardian outage. Say so and keep the probe
                  # verdict driven by the checks that actually tested the service.
                  rows.append(f"| {name} service (Render) | unknown "
                              f"| {type(e).__name__} querying Render | — |")

          print("\n".join(rows))

          def api(method, path, body=None):
              req = urllib.request.Request(
                  f"{GH}{path}", method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"GitHub API {e.code} on {method} {path}: "
                                   f"{e.read().decode()[:200]}")

          open_issues = api("GET", f"/repos/{REPO}/issues?state=open&labels={LABEL}&per_page=1")
          current = open_issues[0] if open_issues else None
          stamp = time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime())
          table = ("| check | state | status | latency |\n|---|---|---|---|\n"
                   + "\n".join(rows))

          if failures:
              body = (f"Probe failed at {stamp}.\n\n" + table
                      + "\n\n**Failing**\n" + "\n".join(f"- {f}" for f in failures)
                      + f"\n\nLatest run: {os.environ['RUN_URL']}\n\n"
                      "This issue is updated in place while the failure persists and closes "
                      "automatically on recovery.")
              if current:
                  # Editing the body does not notify; a comment would, every 20 minutes.
                  api("PATCH", f"/repos/{REPO}/issues/{current['number']}", {"body": body})
                  print(f"\nStill failing — updated issue #{current['number']} in place.")
              else:
                  made = api("POST", f"/repos/{REPO}/issues", {
                      "title": "Guardian: production probe failing",
                      "body": body, "labels": [LABEL]})
                  print(f"\nOpened issue #{made['number']}.")
              sys.exit(len(failures))

          if current:
              api("POST", f"/repos/{REPO}/issues/{current['number']}/comments",
                  {"body": f"Recovered at {stamp}. All probes green.\n\n{table}"})
              api("PATCH", f"/repos/{REPO}/issues/{current['number']}",
                  {"state": "closed", "state_reason": "completed"})
              print(f"\nRecovered — closed issue #{current['number']}.")
          else:
              print("\nAll probes green; nothing to alert on.")
          PY
