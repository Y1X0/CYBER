id: cors-wildcard-with-credentials
info:
  name: CORS policy pairs a wildcard origin with credentials
  author: guardian
  severity: low
  description: |
    The response sends `Access-Control-Allow-Origin: *` together with
    `Access-Control-Allow-Credentials: true`.

    THIS IS A CONFIGURATION SIGNAL, NOT A CONFIRMED VULNERABILITY. Browsers refuse this exact
    combination — a wildcard origin voids the credentialed request — so it is not directly
    exploitable from a browser. What it indicates is a CORS policy assembled without a model of how
    the two headers interact, and that same policy is usually one line away from the form that IS
    exploitable: reflecting the caller's `Origin` back while allowing credentials.

    MANUAL STEP TO CONFIRM: replay a request to an authenticated endpoint with
    `Origin: https://attacker.example` and read the response. If `Access-Control-Allow-Origin` comes
    back carrying that value rather than `*`, the policy reflects arbitrary origins and this becomes
    a real cross-origin data-disclosure finding. Guardian cannot perform that check: comparing a
    response against a value we sent is expression evaluation, which the template validator refuses
    by design.
  remediation: |
    Decide which of the two you need. If credentials must cross origins, replace the wildcard with
    an explicit allowlist of origins — never with the request's own `Origin`. If they need not, drop
    `Access-Control-Allow-Credentials`.
  classification:
    cwe-id: CWE-942
  tags: misconfig,cors,headers
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      # Both headers, anchored per line. Either alone is ordinary: a wildcard on a public read-only
      # API is a deliberate and common choice, and credentials with a specific origin is the correct
      # configuration. Only the pair is the signal, so both regexes must hit.
      - type: regex
        part: header
        regex:
          - '(?im)^access-control-allow-origin:\s*\*\s*$'
          - '(?im)^access-control-allow-credentials:\s*true\s*$'
        condition: and
