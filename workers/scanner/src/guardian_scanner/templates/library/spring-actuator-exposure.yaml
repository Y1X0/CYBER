id: spring-actuator-exposure
info:
  name: Exposed Spring Boot actuator
  author: guardian
  severity: medium
  description: |
    The actuator endpoint is reachable unauthenticated. Depending on which endpoints are enabled it
    exposes configuration, environment variables, heap dumps or thread dumps.
  remediation: Put actuator behind authentication and expose only health/info.
  classification:
    cwe-id: CWE-200
  tags: exposure,springboot
http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"_links"'
