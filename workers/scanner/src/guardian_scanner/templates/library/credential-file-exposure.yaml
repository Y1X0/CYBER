id: credential-file-exposure
info:
  name: Exposed credential file
  author: guardian
  severity: high
  description: |
    A file that exists to hold long-lived credentials is readable over HTTP — an AWS shared
    credentials file, an npm registry token, or a PyPI upload password. Unlike a config file that
    may or may not contain a secret, these formats have no other purpose: a match means a
    credential was served.

    Treat every value in the file as compromised from the moment the path was reachable, not from
    the moment it was found. The evidence for this template is redacted in full — the loader marks
    it automatically because the id and tags carry credential hints — so the finding records that a
    credential was exposed without transcribing it into the report.
  remediation: |
    Remove the file from the document root, then ROTATE the credentials — deleting the file does not
    revoke what was already served. For AWS, prefer instance roles or OIDC over a static key pair.
  classification:
    cwe-id: CWE-538
    cvss-score: 7.5
  tags: exposure,credential,secret,aws
http:
  - method: GET
    path:
      - "{{BaseURL}}/.aws/credentials"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      # The key name, not just the INI section: `[default]` alone appears in many unrelated files.
      - type: regex
        part: body
        regex:
          - '(?im)^\s*aws_(access_key_id|secret_access_key)\s*='
  - method: GET
    path:
      - "{{BaseURL}}/.npmrc"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      # An .npmrc without a token is harmless configuration (registry URL, save-exact). Requiring
      # the auth key is what makes this a credential finding rather than a file-listing one.
      - type: regex
        part: body
        regex:
          - '(?im)^.*(_authToken|_auth|_password)\s*='
  - method: GET
    path:
      - "{{BaseURL}}/.pypirc"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?im)^\s*(password|username)\s*[:=]'
